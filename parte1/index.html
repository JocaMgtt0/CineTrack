<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CineTrack</title>
</head>


<body>

    <header>

        <h1>CineTrack</h1>
        <input type="search" aria-label="Bucar filmes" class="inputFilme" placeholder="Digite um filme">
        <button class="adicionar">+<span id="addLabel"> Adicionar</span></button>
        
        <div>
            <hr>
        </div>
    </header>

    <nav aria-label="Filtros de status" class="navegacao">
        <button class="ativo" id="todos" data-status="todos">Todos</button>
        <button id="Assistido" data-status="assistido">Assistido</button>
        <button id="Assistindo" data-status="assistindo">Assistindo</button>
        <button id="Quero" data-status="quero">Quero Assistir</button>
    </nav>

<main class="corpo-principal">

    <section class="lista" id="lista" aria-live="polite">
    </section>

</main>
    <footer>
        <span class="rodape">
            <small>CineTrack - UEM </small>
        </span>
        <br>
        <span class="adicionarFilme">
            <a href="adicionar.html" class="addFooter" id="addFooter">
               <small> Adicionar + </small>
            </a>
        </span>
        <br>
        <a href="sobre.html" class="addFooter">Sobre</a>

    </footer>

    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h2>Adicionar Filme</h2>
            <form id="form-filme" action="/filmes" method="post">
                <label for="titulo"> Titulo</label><br>
                    <input type="text" id="titulo" name="titulo" required >
                    <br><br>

                <label for="ano">Ano</label><br>
                    <input type="number" id="ano" name="ano" min="1888" max="2030" required>
                    <br><br>

                <label for="genero">Gênero</label><br>
                    <input type="text" id="genero" name="genero" required>
                    <br><br>

                <label for="urlPoster">URL do pôster</label><br>
                    <input type="url" title="urlPoster" id="urlPoster" name="urlPoster" placeholder="...">
                    <br><br>

                    <label for="status">Status</label><br>
                    <select name="status" id="status" required >

                        <option value="queroAssistir">Quero assistir</option>
                        <option value="assistido">Assistido</option>
                    </select><br><br>

                <label for="nota">Nota (1 a 5)</label><br>
                    <input type="number" name="nota" id="nota" min="0" max="5">
                    <br><br>

                <label for="comentario">Comentário</label><br>
                <textarea name="comentario" id="comentario" rows="4" cols="50"></textarea><br><br>
            </form>

            <button type="button" id="can">Cancelar</button>
            <button type="submit" id="Salvar">Salvar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
